[package]
name = "blobdev"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Serve objects from S3, WebDAV or any object store as a block device, with a local cache"
license = "Apache-2.0"

[lib]
name = "blobdev"
path = "src/lib.rs"

[[bin]]
name = "blobdev"
path = "src/main.rs"

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
crc32fast = "1"
libc = "0.2"
libublk = "0.4"
http = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
ureq = { version = "3", default-features = false, features = ["rustls"] }
